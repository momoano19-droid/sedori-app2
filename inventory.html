<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#3976f6"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./css/style.css?v=routesearch2"><link rel="stylesheet" href="./css/pro-nav.css?v=1"><title>仕入・在庫管理 - せどりGPS店舗管理PRO</title><style>.inv [hidden],#editor[hidden]{display:none!important}.invgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.invgrid>div{background:#f4f6fa;padding:12px;border-radius:12px}.inv label{display:block;font-size:14px;font-weight:600;min-width:0}.inv input,.inv select,.inv textarea{display:block;width:100%;box-sizing:border-box;min-width:0;font-size:16px;padding:10px;margin:5px 0 10px;border:1px solid #d4dae5;border-radius:10px;background:white;color:#20243b}.inv button{margin:6px 0;padding:12px;border-radius:12px;border:0;background:#edf0f5;color:#20243b;font-weight:bold}.inv button.invprimary{width:100%;background:#3976f6;color:white}.invitem{display:flex;gap:12px;border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.invitem img,#preview{width:85px;height:85px;object-fit:contain;border-radius:8px}.invitem>div{flex:1;min-width:0}.invwide{grid-column:1/-1}.invsmall{font-size:13px;color:#626b7a}.inv input[type=date]{appearance:none;-webkit-appearance:none;max-width:100%;min-width:0!important;width:100%!important;box-sizing:border-box!important;padding-inline:8px}.inv input[type=date]::-webkit-date-and-time-value{min-width:0;text-align:left}.inv input[readonly]{background:#f4f6fa}.invgrid>div h3{margin:6px 0 0;font-size:19px}.invgrid>div{padding:10px}.invtools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.invtools label{min-width:0}.invitem p{margin:5px 0;font-size:14px}.invitem button{margin:6px 8px 0 0}.invtag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;background:#edf0f5;margin:3px 5px 3px 0}.invtag.listed{background:#e3edff;color:#2457b7}.invtag.old{background:#fff0d6;color:#875000}.invtag.veryold{background:#ffe4e4;color:#a32222}.invpositive{color:#167347}.invnegative{color:#b42318}.invitem.compact img{width:64px;height:64px}.invitem.compact{gap:9px}.invitem .invsmall{font-size:12px}.inv #editor{scroll-margin-top:20px}</style></head><body class="proNavPage"><main class="container"><header class="appHeader card"><h1 class="appTitle">仕入・在庫管理</h1><div class="appSub">商品登録・在庫管理の専用画面。</div></header><section class="card inv"><div id="stats" class="invgrid"></div><button id="add" class="invprimary">＋ 新規商品登録</button><p id="notice" role="status"></p><input id="search" placeholder="商品名・メーカー・型番で検索"><select id="filter"><option value="">すべて</option><option>未出品</option><option>出品中</option><option>販売済</option></select><div class="invtools"><label>表示形式<select id="layout"><option value="compact">コンパクト</option><option value="detail">詳細</option></select></label><label>並べ替え<select id="sort"><option value="new">仕入日（新しい順）</option><option value="old">在庫日数（長い順）</option><option value="profit">見込み利益（高い順）</option><option value="margin">利益率（高い順）</option></select></label><label>カテゴリ<select id="categoryFilter"><option value="">すべて</option></select></label><label>販売予定先<select id="platformFilter"><option value="">すべて</option></select></label><label>仕入方法<select id="methodFilter"><option value="">すべて</option><option>店舗</option><option>電脳</option></select></label><label>長期在庫<select id="ageFilter"><option value="0">すべて</option><option value="30">30日以上</option><option value="60">60日以上</option><option value="90">90日以上</option></select></label></div><p id="count" class="invsmall"></p><div id="items"></div></section><section class="card inv" id="editor" hidden><h2>商品登録・編集</h2><form id="form"><div id="fields" class="invgrid"></div><label>商品写真（1枚）<input id="photo" type="file" accept="image/*"></label><img id="preview" hidden alt="商品写真"><button type="button" id="removePhoto">写真を削除</button><p id="estimate"></p><button class="invprimary" type="submit">保存する</button><button type="button" id="cancel">キャンセル</button></form></section></main><nav class="proBottomNav" aria-label="メインメニュー"><a href="./home.html"><span aria-hidden="true">🏠</span><span>ホーム</span></a><a href="./index.html"><span aria-hidden="true">🏬</span><span>店舗</span></a><a href="./inventory.html" aria-current="page"><span aria-hidden="true">📦</span><span>仕入・在庫</span></a><a href="./sales.html"><span aria-hidden="true">💰</span><span>売上</span></a><a href="./report.html"><span aria-hidden="true">📊</span><span>分析</span></a></nav><script src="./js/inventory.js?v=3"></script></body></html>
